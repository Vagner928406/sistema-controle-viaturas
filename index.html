<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Manutenção de Viaturas</title>
<style>
:root{--azul:#0b2f4f;--azul2:#14507f;--fundo:#eef1f5;--borda:#d5dbe3;--txt:#1d2733;--verm:#c62f3b;--amar:#f2b53a;--verde:#1f8a4c}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--fundo);color:var(--txt)}
button,input,select{font:inherit}
button{border:0;border-radius:6px;padding:8px 13px;cursor:pointer;background:var(--azul2);color:#fff}
button:hover{filter:brightness(1.12)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7db3e6;outline-offset:1px}
.sec{background:#e4e8ee;color:var(--txt)}.perigo{background:var(--verm)}.ok{background:var(--verde)}
input,select{width:100%;padding:9px;border:1px solid var(--borda);border-radius:6px;background:#fff}
input:disabled,select:disabled{background:#f1f3f6;color:#333}
label{display:block;font-size:12px;font-weight:600;margin:8px 0 2px}
#login{max-width:380px;margin:12vh auto;background:#fff;padding:26px;border-radius:10px;border:1px solid var(--borda)}
#login h1{font-size:20px;margin:0 0 6px;color:var(--azul)}
#erroLogin{color:var(--verm);margin:8px 0 0}
header{background:var(--azul);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}
header img{height:44px}header h1{font-size:19px;margin:0;flex:1}
header small{opacity:.8}
main{padding:18px 20px;max-width:1500px;margin:auto}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.resumo div{background:#fff;border:1px solid var(--borda);border-left:5px solid var(--azul2);border-radius:8px;padding:10px 14px}
.resumo b{display:block;font-size:26px;line-height:1.1}
.resumo .a{border-left-color:var(--verm)}.resumo .a b{color:var(--verm)}
.barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.barra input[type=search]{flex:2;min-width:220px}.barra select{flex:1;min-width:150px}
.barra label{display:flex;gap:6px;align-items:center;margin:0;font-size:13px}
.barra label input{width:auto}
.tabela{overflow-x:auto;background:#fff;border:1px solid var(--borda);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:900px}
th{background:var(--azul);color:#fff;text-align:left;padding:10px;font-weight:600}
td{padding:9px 10px;border-top:1px solid var(--borda);vertical-align:top}
td small{color:#5b6877}
tr.baixada td:not(.acoes):not(.st){opacity:.65}
.obs{width:100%;min-width:190px;min-height:48px;padding:6px 8px;border:1px solid var(--borda);border-radius:6px;font:inherit;resize:vertical;background:#fff}
.pref{background:none;color:var(--azul2);padding:0;font-weight:700;font-size:inherit;text-decoration:underline;cursor:pointer}
.pref:hover{filter:none;color:var(--azul)}
.stsel{width:auto;padding:5px 6px;font-weight:700;color:inherit;cursor:pointer}
.st{font-weight:700}.st-Disponível{color:var(--verde)}.st-Manutenção{color:#b86a00}.st-Emprestada{color:#1a62b8}.st-Baixada{color:var(--verm)}
.chip{display:inline-block;margin:0 4px 4px 0;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:600}
.chip.v{background:var(--verm);color:#fff}.chip.p{background:var(--amar);color:#4a3500}
td.acoes{white-space:nowrap}td.acoes button{padding:6px 10px;margin-right:4px}
.vazio{padding:28px;text-align:center;color:#5b6877}
dialog{border:0;border-radius:10px;padding:22px;width:min(760px,calc(100% - 24px));max-height:92vh;box-shadow:0 8px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 4px;color:var(--azul);font-size:18px}
.cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:2px 12px}
.grade h3{grid-column:1/-1;margin:14px 0 0;font-size:13px;color:var(--azul2);border-bottom:1px solid var(--borda);padding-bottom:3px}
.rodape{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hist{max-height:260px;overflow:auto;margin-top:8px}
.hist table{min-width:520px}.hist th{padding:7px}.hist td{padding:6px 8px}
#aviso{position:fixed;inset:auto auto 16px 50%;transform:translateX(-50%);margin:0;border:0;max-width:calc(100% - 24px);background:var(--azul);color:#fff;padding:10px 18px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#aviso.erro{background:var(--verm);inset:16px auto auto 50%;font-weight:600}
@media(max-width:600px){main{padding:12px}header h1{font-size:16px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>

<form id="login">
  <h1>Controle de Viaturas</h1>
  <small>Entre com seu e-mail e senha.</small>
  <label for="email">E-mail</label>
  <input type="email" id="email" autocomplete="username" required>
  <label for="senha">Senha</label>
  <input type="password" id="senha" autocomplete="current-password" required>
  <button type="submit" id="btnEntrar" style="width:100%;margin-top:14px">Entrar</button>
  <p id="erroLogin" role="alert" hidden></p>
</form>

<div id="app" hidden>
<header>
  <img src="logo-viaturas-fundo-transparente.png" alt="" onerror="this.remove()">
  <h1>Controle de Manutenção de Viaturas <small id="perfilTxt"></small></h1>
  <button class="sec" id="btnCsv">Exportar planilha</button>
  <button class="sec" id="btnSair">Sair</button>
</header>
<main>
  <section class="resumo" id="resumo"></section>
  <div class="barra">
    <input type="search" id="busca" placeholder="Pesquisar prefixo, placa, marca, modelo, emprego ou observação" aria-label="Pesquisar">
    <select id="fStatus" aria-label="Filtrar por status">
      <option value="">Todos os status</option><option>Disponível</option><option>Manutenção</option><option>Emprestada</option><option>Baixada</option>
    </select>
    <label><input type="checkbox" id="fAlerta"> Só com alertas</label>
    <button class="ok so-admin" id="btnNova" hidden>Nova viatura</button>
  </div>
  <div class="tabela"><table>
    <thead><tr><th>Viatura</th><th>Veículo</th><th>KM atual</th><th>Status</th><th>Próxima troca de óleo</th><th>Próx. filtros (KM)</th><th>Alertas</th><th>Observações</th><th>Ações</th></tr></thead>
    <tbody id="lista"></tbody>
  </table></div>
</main>
</div>

<dialog id="dlgForm">
  <form id="form">
    <div class="cab"><h2 id="formTitulo"></h2><button type="button" class="sec" data-fechar>Fechar</button></div>
    <div class="grade" id="campos"></div>
    <div class="rodape" id="formRodape">
      <button type="submit" class="ok">Salvar</button>
      <button type="button" class="sec" data-fechar>Cancelar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgHist">
  <div class="cab"><h2 id="histTitulo"></h2><button type="button" class="sec" data-fechar>Fechar</button></div>
  <form id="formHist" class="so-admin" hidden>
    <div class="grade">
      <div><label for="hData">Data</label><input type="date" id="hData" required></div>
      <div><label for="hKm">KM da viatura</label><input type="number" id="hKm" min="0" required></div>
      <div><label for="hOficina">Oficina/Responsável</label><input id="hOficina"></div>
      <div><label for="hValor">Valor (R$)</label><input type="number" id="hValor" min="0" step="0.01"></div>
    </div>
    <label for="hDesc">Serviço realizado</label>
    <input id="hDesc" placeholder="Ex.: troca de óleo e filtros" required>
    <div class="rodape"><button type="submit" class="ok" id="hSalvar">Registrar manutenção</button><button type="button" class="sec" id="hCancelar" hidden>Cancelar edição</button></div>
  </form>
  <p id="histTotal" style="margin:14px 0 0;font-weight:600"></p>
  <div class="hist" id="histLista"></div>
</dialog>

<dialog id="dlgDados">
  <form id="formDados">
    <div class="cab"><h2 id="dadosTitulo"></h2><button type="button" class="sec" data-fechar>Fechar</button></div>
    <div class="grade" id="camposDados"></div>
    <div class="rodape">
      <button type="submit" class="ok" id="dadosSalvar">Salvar dados</button>
      <button type="button" class="sec" data-fechar>Cancelar</button>
    </div>
  </form>
</dialog>

<div id="aviso" popover="manual" role="status"></div>

<script>
if (typeof supabase === "undefined") {
  const e = document.getElementById("erroLogin");
  e.textContent = "Não foi possível carregar a biblioteca do Supabase. Verifique a conexão com a internet e recarregue a página.";
  e.hidden = false;
  throw new Error("Biblioteca do Supabase não carregou");
}
const sb = supabase.createClient("https://jxtivpcduhomnnqpukaj.supabase.co", "sb_publishable_lJTNW-tGjLGPEZdkqY3q6w_R2OqNerz");
const $ = id => document.getElementById(id);
const LIMITE_KM = 500, LIMITE_DIAS = 30;

// [campo, rótulo, tipo, grupo]
const CAMPOS = [
  ["prefixo","Prefixo","text","Identificação"],["placa","Placa","text"],["marca","Marca","text"],["modelo","Modelo","text"],
  ["ano","Ano (AAAA ou AAAA/AAAA)","text"],["emprego","Emprego","text"],["km","KM atual","number"],
  ["status","Status","select"],["observacao","Observação","text"],
  ["ultima_revisao","Última revisão/manutenção","date","Manutenção"],["troca_oleo","Data da próxima troca de óleo","date"],
  ["km_troca_oleo","KM da próxima troca de óleo","number"],["km_filtro_oleo","KM da próxima troca do filtro de óleo","number"],
  ["km_filtro_combustivel","KM da próxima troca do filtro de combustível","number"],["km_filtro_ar","KM da próxima troca do filtro de ar","number"],
  ["cartao_abastecimento","Cartão de abastecimento","text","Documentos e dados técnicos"],["renavam","Renavam","text"],["chassi","Chassi","text"],
  ["numeracao_pneu","Numeração do pneu","text"],["numero_motor","Número do motor","text"],["patrimonio","Patrimônio","text"],["combustivel","Combustível","text"]
];
const MAIUSC = ["prefixo","placa","marca","modelo","emprego","chassi"];
const STATUS = ["Disponível","Manutenção","Emprestada","Baixada"];

let admin = false, frota = [], editando = null, histId = null, histRows = [], histEdit = null;

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtKm = v => v == null ? "-" : Number(v).toLocaleString("pt-BR");
const fmtData = d => d ? d.split("-").reverse().join("/") : "-";
const norm = s => String(s ?? "").toLocaleLowerCase("pt-BR").normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function aviso(msg, erro) {
  const a = $("aviso"); a.textContent = msg; a.className = erro ? "erro" : "";
  if (a.matches(":popover-open")) a.hidePopover();
  a.showPopover();
  clearTimeout(aviso.t); aviso.t = setTimeout(() => a.matches(":popover-open") && a.hidePopover(), erro ? 7000 : 2500);
}
function msgErro(e) {
  const m = e?.message || String(e);
  if (/duplicate key.*prefixo/i.test(m)) return "Já existe uma viatura com este prefixo.";
  if (/duplicate key.*placa/i.test(m)) return "Já existe uma viatura com esta placa.";
  if (/multiple \(or no\) rows/i.test(m)) return "Não foi possível salvar: confirme que seu usuário é administrador.";
  if (/row-level security/i.test(m)) return "Sem permissão: apenas administradores podem alterar dados.";
  return "Erro: " + m;
}

// ---------- Alertas ----------
function alertas(v) {
  if (v.status === "Baixada") return [];
  const a = [];
  if (v.troca_oleo) {
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const d = Math.round((new Date(v.troca_oleo + "T00:00:00") - hoje) / 864e5);
    if (d < 0) a.push(["v", `Óleo vencido há ${-d} dia(s)`]);
    else if (d <= LIMITE_DIAS) a.push(["p", d === 0 ? "Óleo vence hoje" : `Óleo em ${d} dia(s)`]);
  }
  [["km_troca_oleo","Troca de óleo"],["km_filtro_oleo","Filtro de óleo"],["km_filtro_combustivel","Filtro de combustível"],["km_filtro_ar","Filtro de ar"]]
    .forEach(([c, nome]) => {
      if (v[c] == null || v.km == null) return;
      const r = v[c] - v.km;
      if (r <= 0) a.push(["v", `${nome} vencido (${fmtKm(-r)} km)`]);
      else if (r <= LIMITE_KM) a.push(["p", `${nome} em ${fmtKm(r)} km`]);
    });
  return a;
}

// ---------- Dados ----------
async function carregar() {
  const { data, error } = await sb.from("frota").select("*").order("prefixo");
  if (error) { aviso(msgErro(error), true); return; }
  frota = data; render();
}

function filtradas() {
  const q = norm($("busca").value.trim()), st = $("fStatus").value, so = $("fAlerta").checked;
  return frota.filter(v =>
    (!q || norm([v.prefixo, v.placa, v.marca, v.modelo, v.emprego, v.status, v.observacao].join(" ")).includes(q)) &&
    (!st || v.status === st) && (!so || alertas(v).length));
}

function render() {
  const n = s => frota.filter(v => v.status === s).length;
  const comAlerta = frota.filter(v => alertas(v).length).length;
  $("resumo").innerHTML = [["Total", frota.length],["Disponíveis", n("Disponível")],["Em manutenção", n("Manutenção")],
    ["Emprestadas", n("Emprestada")],["Baixadas", n("Baixada")]].map(([t, x]) => `<div><b>${x}</b>${t}</div>`).join("")
    + `<div class="a"><b>${comAlerta}</b>Com alertas</div>`;
  const lista = filtradas();
  $("lista").innerHTML = lista.length ? lista.map(v => {
    const al = alertas(v);
    return `<tr data-id="${v.id}" class="${v.status === "Baixada" ? "baixada" : ""}">
      <td><button class="pref" data-a="dados" title="Ver dados técnicos">${esc(v.prefixo)}</button><br><small>${esc(v.placa)}</small></td>
      <td>${esc(v.marca)} ${esc(v.modelo)}<br><small>${esc(v.ano)}${v.emprego ? " · " + esc(v.emprego) : ""}</small></td>
      <td>${fmtKm(v.km)}</td>
      <td class="st st-${esc(v.status)}">${admin ? `<select class="stsel" data-id="${v.id}" aria-label="Alterar status">${STATUS.map(x => `<option${x === v.status ? " selected" : ""}>${x}</option>`).join("")}</select>` : esc(v.status)}</td>
      <td>${fmtData(v.troca_oleo)}<br><small>${v.km_troca_oleo != null ? fmtKm(v.km_troca_oleo) + " km" : "-"}</small></td>
      <td><small>Óleo ${fmtKm(v.km_filtro_oleo)}<br>Comb. ${fmtKm(v.km_filtro_combustivel)}<br>Ar ${fmtKm(v.km_filtro_ar)}</small></td>
      <td>${al.map(([t, m]) => `<span class="chip ${t}">${esc(m)}</span>`).join("") || "<small>Em dia</small>"}</td>
      <td>${admin ? `<textarea class="obs" data-id="${v.id}" rows="2" maxlength="500" placeholder="Adicionar observação" aria-label="Observações">${esc(v.observacao)}</textarea>` : esc(v.observacao) || "-"}</td>
      <td class="acoes"><button data-a="hist">Histórico</button> <button class="sec" data-a="dados">Dados</button>
        <button class="sec" data-a="ver">${admin ? "Editar" : "Detalhes"}</button>
        ${admin ? '<button class="perigo" data-a="del">Excluir</button>' : ""}</td></tr>`;
  }).join("") : `<tr><td colspan="9" class="vazio">Nenhuma viatura encontrada.${admin ? " Use “Nova viatura” para cadastrar." : ""}</td></tr>`;
}

// ---------- Formulário da viatura ----------
function montarCampos() {
  let html = "";
  CAMPOS.forEach(([c, rot, tipo, grupo]) => {
    if (grupo) html += `<h3>${grupo}</h3>`;
    const ctl = tipo === "select"
      ? `<select id="f_${c}" required>${STATUS.map(s => `<option>${s}</option>`).join("")}</select>`
      : `<input id="f_${c}" type="${tipo}" ${tipo === "number" ? 'min="0"' : ""} ${["prefixo","placa","marca","modelo","ano","km"].includes(c) ? "required" : ""} ${MAIUSC.includes(c) ? 'style="text-transform:uppercase"' : ""}>`;
    html += `<div><label for="f_${c}">${rot}</label>${ctl}</div>`;
  });
  $("campos").innerHTML = html;
}

function abrirForm(v) {
  editando = v ? v.id : null;
  $("formTitulo").textContent = v ? `${admin ? "Editar" : "Detalhes de"} ${v.prefixo} / ${v.placa}` : "Nova viatura";
  CAMPOS.forEach(([c]) => { const el = $("f_" + c); el.value = v?.[c] ?? (c === "status" ? "Disponível" : c === "km" ? 0 : ""); el.disabled = !admin; });
  $("formRodape").children[0].hidden = !admin;
  $("dlgForm").showModal();
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (!admin) return;
  const o = {};
  for (const [c, , tipo] of CAMPOS) {
    let val = $("f_" + c).value.trim();
    if (MAIUSC.includes(c)) val = val.toLocaleUpperCase("pt-BR");
    o[c] = val === "" ? null : (tipo === "number" ? Number(val) : val);
  }
  const anos = String(o.ano).split("/");
  if (!/^\d{4}(\/\d{4})?$/.test(o.ano) || anos.some(a => a < 1950 || a > 2100)) return aviso("Informe o ano como AAAA ou AAAA/AAAA.", true);
  const req = editando
    ? sb.from("frota").update(o).eq("id", editando).select().single()
    : sb.from("frota").insert(o).select().single();
  const { data, error } = await req;
  if (error) return aviso(msgErro(error), true);
  const i = frota.findIndex(v => v.id === data.id);
  if (i >= 0) frota[i] = data; else frota.push(data);
  frota.sort((a, b) => a.prefixo.localeCompare(b.prefixo, "pt-BR", { numeric: true }));
  $("dlgForm").close(); render(); aviso("Viatura salva.");
});

async function excluir(v) {
  if (!confirm(`Excluir a viatura ${v.prefixo} / ${v.placa} e todo o seu histórico de manutenção?`)) return;
  const { error } = await sb.from("frota").delete().eq("id", v.id);
  if (error) return aviso(msgErro(error), true);
  frota = frota.filter(x => x.id !== v.id); render(); aviso("Viatura excluída.");
}

// ---------- Histórico de manutenção ----------
async function abrirHist(v) {
  histId = v.id;
  $("histTitulo").textContent = `Histórico — ${v.prefixo} / ${v.placa}`;
  sairEdicaoHist();
  $("dlgHist").showModal(); await listarHist();
}

function sairEdicaoHist() {
  histEdit = null;
  $("hSalvar").textContent = "Registrar manutenção"; $("hCancelar").hidden = true;
  $("formHist").reset();
  const v = frota.find(x => x.id === histId); $("hKm").value = v?.km ?? "";
}

async function listarHist() {
  const { data, error } = await sb.from("manutencoes").select("*").eq("viatura_id", histId).order("data", { ascending: false });
  if (error) { $("histLista").innerHTML = ""; return aviso(msgErro(error), true); }
  histRows = data;
  const total = data.reduce((s, r) => s + (Number(r.valor) || 0), 0);
  $("histTotal").textContent = data.length ? `${data.length} registro(s) · custo total ${total.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}` : "";
  $("histLista").innerHTML = data.length ? `<table><thead><tr><th>Data</th><th>KM</th><th>Serviço</th><th>Oficina</th><th>Valor</th>${admin ? "<th></th>" : ""}</tr></thead><tbody>${data.map(r =>
    `<tr><td>${fmtData(r.data)}</td><td>${fmtKm(r.km)}</td><td>${esc(r.descricao)}</td><td>${esc(r.oficina) || "-"}</td>
     <td>${r.valor != null ? Number(r.valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }) : "-"}</td>
     ${admin ? `<td class="acoes"><button class="sec" data-edit="${r.id}">Editar</button> <button class="perigo" data-del="${r.id}">Excluir</button></td>` : ""}</tr>`).join("")}</tbody></table>`
    : "<p>Nenhuma manutenção registrada.</p>";
}

$("formHist").addEventListener("submit", async e => {
  e.preventDefault();
  const reg = { viatura_id: histId, data: $("hData").value, km: Number($("hKm").value), descricao: $("hDesc").value.trim(),
    oficina: $("hOficina").value.trim() || null, valor: $("hValor").value === "" ? null : Number($("hValor").value) };
  const { error } = histEdit
    ? await sb.from("manutencoes").update({ data: reg.data, km: reg.km, descricao: reg.descricao, oficina: reg.oficina, valor: reg.valor }).eq("id", histEdit)
    : await sb.from("manutencoes").insert(reg);
  if (error) return aviso(msgErro(error), true);
  // atualiza a viatura: última revisão e KM (apenas se o registro for mais recente/maior)
  const v = frota.find(x => x.id === histId), up = {};
  if (!v.ultima_revisao || reg.data > v.ultima_revisao) up.ultima_revisao = reg.data;
  if (reg.km > (v.km ?? 0)) up.km = reg.km;
  if (Object.keys(up).length) {
    const { data } = await sb.from("frota").update(up).eq("id", histId).select().single();
    if (data) { frota[frota.findIndex(x => x.id === histId)] = data; render(); }
  }
  const editou = !!histEdit;
  sairEdicaoHist();
  await listarHist(); aviso(editou ? "Manutenção atualizada." : "Manutenção registrada.");
});

$("histLista").addEventListener("click", async e => {
  if (e.target.dataset.edit) {
    const r = histRows.find(x => x.id === Number(e.target.dataset.edit)); if (!r) return;
    histEdit = r.id;
    $("hData").value = r.data; $("hKm").value = r.km; $("hOficina").value = r.oficina ?? "";
    $("hValor").value = r.valor ?? ""; $("hDesc").value = r.descricao;
    $("hSalvar").textContent = "Salvar alterações"; $("hCancelar").hidden = false;
    $("dlgHist").scrollTo({ top: 0, behavior: "smooth" }); $("hData").focus();
    return;
  }
  const id = e.target.dataset.del; if (!id || !confirm("Excluir este registro de manutenção?")) return;
  const { error } = await sb.from("manutencoes").delete().eq("id", id);
  if (error) return aviso(msgErro(error), true);
  if (Number(id) === histEdit) sairEdicaoHist();
  await listarHist();
});

// ---------- Exportar ----------
$("btnCsv").onclick = () => {
  const cols = CAMPOS.map(c => c[0]), cab = CAMPOS.map(c => c[1]);
  const cel = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = "\uFEFF" + [cab, ...filtradas().map(v => cols.map(c => v[c]))].map(l => l.map(cel).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `viaturas-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
};

// ---------- Eventos da tela ----------
$("lista").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const v = frota.find(x => x.id === Number(b.closest("tr").dataset.id));
  if (b.dataset.a === "hist") abrirHist(v); else if (b.dataset.a === "dados") abrirDados(v); else if (b.dataset.a === "ver") abrirForm(v); else if (b.dataset.a === "del") excluir(v);
});
$("lista").addEventListener("change", async e => {
  const ob = e.target.closest(".obs");
  if (ob) {
    const { data, error } = await sb.from("frota").update({ observacao: ob.value.trim() || null }).eq("id", Number(ob.dataset.id)).select().single();
    if (error) { aviso(msgErro(error), true); return render(); }
    frota[frota.findIndex(v => v.id === data.id)] = data; aviso("Observação salva."); return;
  }
  const el = e.target.closest(".stsel"); if (!el) return;
  const { data, error } = await sb.from("frota").update({ status: el.value }).eq("id", Number(el.dataset.id)).select().single();
  if (error) { aviso(msgErro(error), true); return render(); }
  frota[frota.findIndex(v => v.id === data.id)] = data; render(); aviso("Status atualizado.");
});
// ---------- Dados técnicos ----------
const TECNICOS = CAMPOS.slice(-7);
let dadosId = null;

function abrirDados(v) {
  dadosId = v.id;
  $("dadosTitulo").textContent = `Dados técnicos — ${v.prefixo} / ${v.placa}`;
  TECNICOS.forEach(([c]) => { const el = $("d_" + c); el.value = v[c] ?? ""; el.disabled = !admin; });
  $("dadosSalvar").hidden = !admin;
  $("dlgDados").showModal();
}

$("formDados").addEventListener("submit", async e => {
  e.preventDefault(); if (!admin) return;
  const o = {};
  TECNICOS.forEach(([c]) => {
    let val = $("d_" + c).value.trim();
    if (c === "chassi") val = val.toLocaleUpperCase("pt-BR");
    o[c] = val || null;
  });
  const { data, error } = await sb.from("frota").update(o).eq("id", dadosId).select().single();
  if (error) return aviso(msgErro(error), true);
  frota[frota.findIndex(v => v.id === data.id)] = data;
  $("dlgDados").close(); render(); aviso("Dados técnicos salvos.");
});

$("btnNova").onclick = () => abrirForm(null);
$("hCancelar").onclick = () => sairEdicaoHist();
["busca", "fStatus", "fAlerta"].forEach(id => $(id).addEventListener("input", render));
document.querySelectorAll("[data-fechar]").forEach(b => b.onclick = () => b.closest("dialog").close());

// ---------- Login ----------
async function entrar() {
  const { data: { user } } = await sb.auth.getUser();
  const { data } = await sb.from("usuarios_perfis").select("perfil").eq("id", user.id).maybeSingle();
  admin = data?.perfil === "admin";
  $("perfilTxt").textContent = admin ? "· Administrador" : "· Consulta";
  document.querySelectorAll(".so-admin").forEach(el => el.hidden = !admin);
  $("login").hidden = true; $("app").hidden = false;
  await carregar();
}

$("login").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("btnEntrar"), erro = $("erroLogin");
  erro.hidden = true; btn.disabled = true; btn.textContent = "Entrando...";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("senha").value });
  btn.disabled = false; btn.textContent = "Entrar";
  try {
    if (error) throw error;
    await entrar();
  } catch (e) {
    const m = e?.message || String(e);
    erro.textContent = /invalid login/i.test(m) ? "E-mail ou senha incorretos."
      : /confirm/i.test(m) ? "E-mail ainda não confirmado no Supabase."
      : "Não foi possível entrar: " + m;
    erro.hidden = false;
  }
});

$("btnSair").onclick = async () => { await sb.auth.signOut(); location.reload(); };

montarCampos();
$("camposDados").innerHTML = TECNICOS.map(([c, rot]) => `<div><label for="d_${c}">${rot}</label><input id="d_${c}"${c === "chassi" ? ' style="text-transform:uppercase"' : ""}></div>`).join("");
sb.auth.getSession().then(({ data }) => { if (data.session) entrar(); });
</script>
</body>
</html>
